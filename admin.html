<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Platform Admin</title>
<style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#18212f}.top{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card,.panel{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}.num{font-size:28px;font-weight:bold}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.btn{padding:9px 12px;border:0;border-radius:8px;background:#e5e7eb;cursor:pointer}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.login{max-width:380px;margin:90px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 5px 25px #0002}.login input,.modal input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}.login button{width:100%;padding:12px;margin-top:8px;background:#111827;color:#fff;border:0;border-radius:8px}.hide{display:none}.error{color:#b91c1c}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.modalbox{background:white;padding:22px;border-radius:14px;width:min(520px,90vw)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;font-size:13px}th{background:#f9fafb}.actions{display:flex;gap:5px;flex-wrap:wrap}</style></head><body>
<div id="login" class="login"><h2>QA Platform Admin</h2><p>Administrator login only</p><input id="email" placeholder="Admin email" type="email"><input id="password" placeholder="Password" type="password"><button onclick="login()">Login</button><p id="err" class="error"></p></div>
<div id="app" class="hide"><div class="top"><b>QA Testing Platform — Admin</b><button class="btn" onclick="logout()">Logout</button></div><div class="wrap"><div class="cards" id="cards"></div><div class="tabs"><button onclick="loadUsers()">Users</button><button onclick="loadTable('projects')">All Projects</button><button onclick="loadTable('test-cases')">All Test Cases</button><button onclick="loadTable('test-runs')">All Test Runs</button><button onclick="loadTable('test-results')">All Results</button></div><div class="panel"><div id="table">Select a section.</div></div></div></div>
<div id="modal" class="modal hide"><div class="modalbox"><h3 id="modalTitle">Create User</h3><input id="uName" placeholder="Full name"><input id="uEmail" placeholder="Email" type="email"><input id="uPassword" placeholder="Password (leave blank when editing)"><div class="actions"><button class="btn primary" onclick="saveUser()">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div><p id="modalErr" class="error"></p></div></div>
<script>const tokenKey='qa_admin_token';let editingId=null;
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Authorization':'Bearer '+localStorage.getItem(tokenKey)};if(opts.body&&!(opts.body instanceof FormData))opts.headers['Content-Type']='application/json';let r=await fetch(path,opts);let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function login(){try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok)throw new Error(d.detail);if(!d.is_admin)throw new Error('Administrator account required');localStorage.setItem(tokenKey,d.access_token);showApp()}catch(e){err.textContent=e.message}}
function logout(){localStorage.removeItem(tokenKey);location.reload()}
async function showApp(){if(!localStorage.getItem(tokenKey))return;try{let d=await api('/api/admin/dashboard');login.classList.add('hide');app.classList.remove('hide');cards.innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div>${esc(k.replaceAll('_',' ').toUpperCase())}</div><div class="num">${v}</div></div>`).join('');loadUsers()}catch(e){logout()}}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function openCreate(){editingId=null;modalTitle.textContent='Create User';uName.value='';uEmail.value='';uPassword.value='';modalErr.textContent='';modal.classList.remove('hide')}
async function openEdit(id){try{let u=await api('/api/admin/users/'+id);editingId=id;modalTitle.textContent='Edit User';uName.value=u.name;uEmail.value=u.email;uPassword.value='';modalErr.textContent='';modal.classList.remove('hide')}catch(e){alert(e.message)}}
function closeModal(){modal.classList.add('hide')}
async function saveUser(){try{if(!uName.value||!uEmail.value||(editingId===null&&!uPassword.value))throw new Error('Name, email and password are required for a new user');let body={name:uName.value,email:uEmail.value};if(uPassword.value)body.password=uPassword.value;if(editingId===null)await api('/api/admin/users',{method:'POST',body:JSON.stringify({...body,password:uPassword.value})});else await api('/api/admin/users/'+editingId,{method:'PUT',body:JSON.stringify(body)});closeModal();loadUsers()}catch(e){modalErr.textContent=e.message}}
async function changeStatus(id,current){try{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({is_active:!current})});loadUsers()}catch(e){alert(e.message)}}
async function deleteUser(id,name){if(!confirm('Delete '+name+' and ALL of this user\'s projects, documents, test cases and test results? This cannot be undone.'))return;try{await api('/api/admin/users/'+id,{method:'DELETE'});loadUsers()}catch(e){alert(e.message)}}
async function viewUser(id){try{let d=await api('/api/admin/users/'+id+'/work');let html=`<h3>User: ${esc(d.user.name)}</h3><p>${esc(d.user.email)} · ${d.user.is_active?'Active':'Inactive'}</p>`;if(!d.projects.length)html+='<p>No projects.</p>';else html+='<table><tr><th>Project</th><th>URL</th><th>Cases</th><th>Runs</th><th>Latest report</th></tr>'+d.projects.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.website_url)}</td><td>${p.test_cases}</td><td>${p.test_runs}</td><td>${p.latest_report?esc(p.latest_report.final_status)+' · '+p.latest_report.pass_percentage+'%':'Not run'}</td></tr>`).join('')+'</table>';table.innerHTML=html}catch(e){table.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function loadUsers(){try{let data=await api('/api/admin/users');table.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h3>User Management</h3><button class="btn primary" onclick="openCreate()">+ Create User</button></div>'+(!data.length?'<p>No users.</p>':'<table><tr><th>ID</th><th>User</th><th>Status</th><th>Work</th><th>Actions</th></tr>'+data.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br>${esc(u.email)}${u.is_admin?' · Admin':''}</td><td>${u.is_active?'<span class="ok">Active</span>':'<span class="danger">Inactive</span>'}</td><td>${u.projects_count} projects · ${u.test_cases_count} cases · ${u.test_runs_count} runs</td><td><div class="actions"><button class="btn" onclick="viewUser(${u.id})">View</button>${!u.is_admin?`<button class="btn" onclick="openEdit(${u.id})">Edit</button><button class="btn" onclick="changeStatus(${u.id},${u.is_active})">${u.is_active?'Deactivate':'Activate'}</button><button class="btn danger" onclick="deleteUser(${u.id},'${esc(u.name).replaceAll("'","\\'")}')">Delete</button>`:''}</div></td></tr>`).join('')+'</table>')}catch(e){table.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function loadTable(name){try{let data=await api('/api/admin/'+name);if(!data.length){table.innerHTML='<p>No records.</p>';return}let keys=Object.keys(data[0]);table.innerHTML='<table><thead><tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+data.map(row=>'<tr>'+keys.map(k=>`<td>${esc(row[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}catch(e){table.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
showApp();</script></body></html>
