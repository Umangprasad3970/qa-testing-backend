<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project List</title><link rel="stylesheet" href="/admin.css"></head><body><div class="top"><div class="brand">QA Admin · Project List</div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside class="side"><a href="/admin">Dashboard</a><a href="/admin/users">User Management</a><a class="active" href="/admin/projects">Project List</a><a href="/admin/test-cases">Test Cases</a><a href="/admin/test-results">Test Case Results</a><a href="/admin/project-reports">Project Report Summary</a></aside><main class="main"><h1>Project List</h1><div class="panel scroll"><table><thead><tr><th>ID</th><th>Project</th><th>User</th><th>URL</th><th>Created</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/admin_common.js"></script><script>async function load(){guard();try{const d=await api('/admin/projects');rows.innerHTML=d.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.user_email)} (#${p.user_id})</td><td>${esc(p.website_url)}</td><td>${esc(p.created_at)}</td><td><button class="btn" onclick="report(${p.id})">Report</button> <button class="btn danger" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}catch(e){rows.innerHTML=`<tr><td colspan="6" class="error">${esc(e.message)}</td></tr>`}}async function report(id){location.href='/admin/project-reports?project_id='+id}async function del(id){if(!confirm('Delete this project and its document, test cases, runs and results?'))return;try{await api('/admin/projects/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}load();</script></body></html>
