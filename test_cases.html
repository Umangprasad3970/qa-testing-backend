<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Cases</title><link rel="stylesheet" href="/admin.css"></head><body><div class="top"><div class="brand">QA Admin · Test Cases</div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside class="side"><a href="/admin">Dashboard</a><a href="/admin/users">User Management</a><a href="/admin/projects">Project List</a><a class="active" href="/admin/test-cases">Test Cases</a><a href="/admin/test-results">Test Case Results</a><a href="/admin/project-reports">Project Report Summary</a></aside><main class="main"><h1>All Test Cases</h1><div class="panel scroll"><table><thead><tr><th>ID</th><th>Project</th><th>User</th><th>Title</th><th>Steps</th><th>Expected Result</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/admin_common.js"></script><script>async function load(){guard();try{const d=await api('/admin/test-cases');rows.innerHTML=d.map(t=>`<tr><td>${t.id}</td><td>${esc(t.project_name)} (#${t.project_id})</td><td>#${t.user_id}</td><td>${esc(t.title)}</td><td>${esc(t.steps)}</td><td>${esc(t.expected_result)}</td><td>${esc(t.created_at)}</td><td><button class="btn danger" onclick="del(${t.id})">Delete</button></td></tr>`).join('')}catch(e){rows.innerHTML=`<tr><td colspan="8" class="error">${esc(e.message)}</td></tr>`}}async function del(id){if(!confirm('Delete this test case?'))return;try{await api('/admin/test-cases/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}load();</script></body></html>
