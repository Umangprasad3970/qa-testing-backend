<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Case Results</title><link rel="stylesheet" href="/admin.css"></head><body><div class="top"><div class="brand">QA Admin · Test Case Results</div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside class="side"><a href="/admin">Dashboard</a><a href="/admin/users">User Management</a><a href="/admin/projects">Project List</a><a href="/admin/test-cases">Test Cases</a><a class="active" href="/admin/test-results">Test Case Results</a><a href="/admin/project-reports">Project Report Summary</a></aside><main class="main"><h1>All Test Case Results</h1><div class="panel scroll"><table><thead><tr><th>ID</th><th>Run</th><th>Project</th><th>User</th><th>Test Case</th><th>Status</th><th>Error</th><th>Duration</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/admin_common.js"></script><script>async function load(){guard();try{const d=await api('/admin/test-results');rows.innerHTML=d.map(x=>`<tr><td>${x.id}</td><td>#${x.run_id}</td><td>${esc(x.project_name)} (#${x.project_id})</td><td>#${x.user_id}</td><td>${esc(x.test_case_title)}</td><td>${esc(x.status)}</td><td>${esc(x.error_message||'')}</td><td>${esc(x.duration_ms||'')} ms</td></tr>`).join('')}catch(e){rows.innerHTML=`<tr><td colspan="8" class="error">${esc(e.message)}</td></tr>`}}load();</script></body></html>
