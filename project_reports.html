<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Report Summary</title><link rel="stylesheet" href="/admin.css"></head><body><div class="top"><div class="brand">QA Admin · Project Report Summary</div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside class="side"><a href="/admin">Dashboard</a><a href="/admin/users">User Management</a><a href="/admin/projects">Project List</a><a href="/admin/test-cases">Test Cases</a><a href="/admin/test-results">Test Case Results</a><a class="active" href="/admin/project-reports">Project Report Summary</a></aside><main class="main"><h1>Project Report Summary</h1><div id="detail"></div><div class="panel scroll"><table><thead><tr><th>Project</th><th>User</th><th>Total</th><th>Passed</th><th>Failed</th><th>Not Run</th><th>Pass %</th><th>Final Status</th><th>Last Run</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/admin_common.js"></script><script>async function load(){guard();try{const d=await api('/admin/project-reports');rows.innerHTML=d.map(p=>`<tr><td><b>${esc(p.project_name)}</b><br>${esc(p.website_url)}</td><td>${esc(p.user_email)}</td><td>${p.total}</td><td>${p.passed}</td><td>${p.failed}</td><td>${p.not_run}</td><td>${p.pass_percentage}%</td><td>${esc(p.final_status)}</td><td>${esc(p.last_run_status||'Not run')}</td></tr>`).join('');const id=new URLSearchParams(location.search).get('project_id');if(id){const r=await api('/admin/projects/'+id+'/report');detail.innerHTML=`<div class="panel" style="margin-bottom:14px"><h2>${esc(r.project_name)}</h2><p>${esc(r.website_url)} · User: ${esc(r.user_email)}</p><div class="grid2"><div>Total: <b>${r.total}</b> · Passed: <b>${r.passed}</b> · Failed: <b>${r.failed}</b></div><div>Pass: <b>${r.pass_percentage}%</b> · Final: <b>${esc(r.final_status)}</b></div></div></div>`}}catch(e){detail.innerHTML=`<p class="error">${esc(e.message)}</p>`}}load();</script></body></html>
