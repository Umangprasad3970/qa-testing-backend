<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management</title><link rel="stylesheet" href="/admin.css"></head><body><div class="top"><div class="brand">QA Admin · User Management</div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside class="side"><a href="/admin">Dashboard</a><a class="active" href="/admin/users">User Management</a><a href="/admin/projects">Project List</a><a href="/admin/test-cases">Test Cases</a><a href="/admin/test-results">Test Case Results</a><a href="/admin/project-reports">Project Report Summary</a></aside><main class="main"><div class="toolbar"><h1>User Management</h1><button class="btn primary" onclick="openCreate()">+ Create User</button></div><div class="panel scroll"><table><thead><tr><th>ID</th><th>User</th><th>Status</th><th>Work</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><div id="modal" class="modal hide"><div class="modalbox"><h3 id="mt">Create User</h3><input id="name" placeholder="Full name"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><div><button class="btn primary" onclick="save()">Save</button> <button class="btn" onclick="closeM()">Cancel</button></div><p id="me" class="error"></p></div></div><script src="/admin_common.js"></script><script>let editId=null;async function load(){guard();try{const d=await api('/admin/users');rows.innerHTML=d.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br>${esc(u.email)}${u.is_admin?' · Admin':''}</td><td>${u.is_active?'<span class="ok">Active</span>':'<span class="badge">Inactive</span>'}</td><td>${u.projects_count} projects · ${u.test_cases_count} cases · ${u.test_runs_count} runs</td><td>${u.is_admin?'':`<button class="btn" onclick="view(${u.id})">View</button> <button class="btn" onclick="edit(${u.id})">Edit</button> <button class="btn" onclick="status(${u.id},${u.is_active})">${u.is_active?'Deactivate':'Activate'}</button> <button class="btn danger" onclick="del(${u.id})">Delete</button>`}</td></tr>`).join('')}catch(e){rows.innerHTML=`<tr><td colspan="5" class="error">${esc(e.message)}</td></tr>`}}function openCreate(){editId=null;mt.textContent='Create User';name.value='';em.value='';pw.value='';me.textContent='';modal.classList.remove('hide')}async function edit(id){const u=await api('/admin/users/'+id);editId=id;mt.textContent='Edit User';name.value=u.name;em.value=u.email;pw.value='';me.textContent='';modal.classList.remove('hide')}function closeM(){modal.classList.add('hide')}async function save(){try{const b={name:name.value,email:em.value};if(pw.value)b.password=pw.value;if(editId===null){if(!pw.value)throw new Error('Password required');await api('/admin/users',{method:'POST',body:JSON.stringify({...b,password:pw.value})})}else await api('/admin/users/'+editId,{method:'PUT',body:JSON.stringify(b)});closeM();load()}catch(e){me.textContent=e.message}}async function status(id,a){try{await api('/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({is_active:!a})});load()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete user and all owned work?'))return;try{await api('/admin/users/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}async function view(id){const d=await api('/admin/users/'+id+'/work');let s=`User: ${esc(d.user.name)} (${esc(d.user.email)})\nProjects: ${d.projects.length}\n\n`;s+=d.projects.map(p=>`${p.name} — ${p.test_cases} cases, ${p.test_runs} runs, ${p.latest_report?p.latest_report.final_status:'Not run'}`).join('\n');alert(s)}load();</script></body></html>
